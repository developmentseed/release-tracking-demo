# Step 8: when a release is published, walk the commits since the previous
# release, find their PRs and the issues those PRs close, then comment on and
# label each one "released in vX.Y.Z".
name: Label released issues

on:
  release:
    types: [published]

jobs:
  label-released:
    runs-on: ubuntu-latest
    steps:
      # Never GITHUB_TOKEN: labels it adds don't trigger project-status.yml.
      - id: app-token
        if: vars.APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: apexskier/github-release-commenter@v1
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.AUTOMATION_TOKEN }}
          comment-template: "Released in {release_link}."
          label-template: "released in {release_tag}"
