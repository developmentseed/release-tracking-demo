# Step 9: issue labeled "released ..." -> Released on the project board.
# The project's built-in workflows do the other moves (see README); none of
# them can react to a label, so this one needs Actions.
name: Project status

on:
  issues:
    types: [labeled]

permissions:
  contents: read

# `secrets` can't be used in `if:`; expose the App ID via env so steps can test it.
env:
  APP_ID: ${{ secrets.DS_RELEASE_BOT_ID }}
  PROJECT_URL: ${{ vars.PROJECT_URL }}

jobs:
  released:
    if: github.event_name == 'issues' && github.event.action == 'labeled' && startsWith(github.event.label.name, 'released')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Uses ds-release-bot if its org secrets are visible, else the AUTOMATION_TOKEN PAT.
      - id: app-token
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DS_RELEASE_BOT_ID }}
          private-key: ${{ secrets.DS_RELEASE_BOT_PRIVATE_KEY }}
      - run: scripts/set-status.sh "$ISSUE_ID" "Released"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.AUTOMATION_TOKEN }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
